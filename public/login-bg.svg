<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Usine de valorisation énergétique avec panaches de vapeur">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="900" height="1100" fill="url(#sky)"/>
  <rect width="900" height="1100" fill="url(#glow)"/>

  <!-- Panaches de vapeur -->
  <g fill="#E0E7FF" filter="url(#soft)" opacity="0.55">
    <ellipse cx="250" cy="330" rx="120" ry="60"/>
    <ellipse cx="320" cy="250" rx="150" ry="70"/>
    <ellipse cx="420" cy="170" rx="170" ry="70"/>
    <ellipse cx="560" cy="360" rx="110" ry="55"/>
    <ellipse cx="640" cy="270" rx="140" ry="65"/>
    <ellipse cx="730" cy="180" rx="150" ry="60"/>
  </g>

  <!-- Cheminées -->
  <g fill="#1E1B4B">
    <rect x="215" y="400" width="64" height="520"/>
    <rect x="205" y="392" width="84" height="18"/>
    <rect x="535" y="470" width="56" height="450"/>
    <rect x="526" y="462" width="74" height="16"/>
  </g>
  <g fill="#6366F1" opacity="0.8">
    <rect x="215" y="440" width="64" height="10"/>
    <rect x="535" y="510" width="56" height="10"/>
  </g>

  <!-- Bâtiments -->
  <g fill="#14123A">
    <rect x="0" y="720" width="360" height="380"/>
    <rect x="360" y="650" width="260" height="450"/>
    <rect x="620" y="760" width="280" height="340"/>
    <polygon points="0,720 180,650 360,720"/>
    <rect x="90" y="600" width="46" height="130"/>
    <rect x="690" y="700" width="40" height="70"/>
  </g>
  <!-- Fenêtres éclairées -->
  <g fill="#C7D2FE" opacity="0.8">
    <rect x="40" y="780" width="36" height="22"/><rect x="100" y="780" width="36" height="22"/><rect x="160" y="780" width="36" height="22"/><rect x="220" y="780" width="36" height="22"/><rect x="280" y="780" width="36" height="22"/>
    <rect x="40" y="840" width="36" height="22"/><rect x="160" y="840" width="36" height="22"/><rect x="280" y="840" width="36" height="22"/>
    <rect x="395" y="720" width="40" height="24"/><rect x="465" y="720" width="40" height="24"/><rect x="535" y="720" width="40" height="24"/>
    <rect x="395" y="790" width="40" height="24"/><rect x="535" y="790" width="40" height="24"/>
    <rect x="660" y="820" width="36" height="22"/><rect x="740" y="820" width="36" height="22"/><rect x="820" y="820" width="36" height="22"/>
  </g>

  <!-- Tuyauterie -->
  <g stroke="#4338CA" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M360 900 H620"/>
    <path d="M300 960 H620 V900"/>
  </g>

  <rect y="960" width="900" height="140" fill="url(#ground)"/>
</svg>
